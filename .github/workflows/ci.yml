name: CI și publicare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meals
          POSTGRES_PASSWORD: meals
          POSTGRES_DB: meals_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meals" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://meals:meals@localhost:5432/meals_test
      E2E_DATABASE_URL: postgres://meals:meals@localhost:5432/meals_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baza pentru testele e2e
        run: PGPASSWORD=meals psql -h localhost -U meals -d meals_test -c "create database meals_e2e"
      - run: npm run check
      - name: Teste unitare și de integrare
        run: npm test
      - run: npm run build
      - name: Teste e2e (Chrome)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publicarea pe server pornește doar după ce variabila DEPLOY_ENABLED=true e setată în repository
  # (Settings → Secrets and variables → Actions → Variables) și există secretele DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - name: Publică pe server prin SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/meals' }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sed -i 's#^MEALS_IMAGE=.*#MEALS_IMAGE=$IMAGE#' .env && docker compose pull && docker compose up -d && docker image prune -f"
      - name: Verifică pornirea
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/meals' }}
        run: |
          for i in $(seq 1 20); do
            if ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker compose ps --format '{{.Health}}' | grep -q healthy"; then
              echo "Aplicația rulează"; exit 0
            fi
            sleep 6
          done
          echo "Aplicația nu a devenit sănătoasă la timp" && exit 1
